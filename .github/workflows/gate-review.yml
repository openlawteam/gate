# Thin GHA trigger workflow — replaces the 1072-line gate-review.yml.
# The gate CLI enqueues the review and returns in ~1s.
# All review logic runs in Python/tmux on the self-hosted runner.
#
# Branch protection requires check context "gate-review".
# The Python orchestrator creates commit statuses with context="gate-review"
# — same context name, so existing branch protection applies automatically.

name: Gate Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
    branches: [main]

# Audit A20 / Group 3C — cancel superseded runs at the GitHub Actions
# level so a rapid-fire sequence of pushes doesn't queue up N runners
# all trying to grab the same worktree. Gate's in-process queue still
# handles cancellation; this just prevents the upstream pile-up.
concurrency:
  group: gate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger:
    runs-on: [self-hosted, macos, gate-reviewer]
    timeout-minutes: 2
    if: >-
      github.event.pull_request.draft == false &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'gate-rerun')
    steps:
      - name: Dispatch to Gate
        env:
          GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_EVENT: ${{ github.event.action }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_BRANCH: ${{ github.event.pull_request.head.ref }}
          GATE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          gate review \
            --pr "$GATE_PR_NUMBER" \
            --repo "$GATE_REPOSITORY" \
            --event "$GATE_EVENT" \
            --head-sha "$GATE_HEAD_SHA" \
            --branch "$GATE_BRANCH" \
            --labels "$GATE_LABELS"

  cleanup:
    runs-on: [self-hosted, macos, gate-reviewer]
    if: github.event.action == 'closed'
    steps:
      - name: Cleanup PR state
        run: gate cleanup-pr --pr "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
