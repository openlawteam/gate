# Thin GHA trigger workflow — replaces the 1072-line gate-review.yml.
# The gate CLI enqueues the review and returns in ~1s.
# All review logic runs in Python/tmux on the self-hosted runner.
#
# Branch protection requires check context "gate-review".
# The Python orchestrator creates commit statuses with context="gate-review"
# — same context name, so existing branch protection applies automatically.

name: Gate Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
    branches: [main]

# Audit A20 / Group 3C — cancel superseded runs at the GitHub Actions
# level so a rapid-fire sequence of pushes doesn't queue up N runners
# all trying to grab the same worktree. Gate's in-process queue still
# handles cancellation; this just prevents the upstream pile-up.
concurrency:
  group: gate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger:
    runs-on: [self-hosted, macos, gate-reviewer]
    timeout-minutes: 2
    # Same-repo PRs only: fork PRs must never reach the self-hosted runner.
    # (Maintainers can push a fork's branch to this repo to get a review.)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'gate-rerun')
    steps:
      - name: Dispatch to Gate
        # PR-controlled strings (branch name, labels) go through env, never
        # interpolated into the script: a branch named `x";curl …|sh;#` would
        # otherwise run on the self-hosted runner.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          gate review \
            --pr "$PR_NUMBER" \
            --repo "$REPO" \
            --event "$EVENT" \
            --head-sha "$HEAD_SHA" \
            --branch "$BRANCH" \
            --labels "$LABELS"

  cleanup:
    runs-on: [self-hosted, macos, gate-reviewer]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    steps:
      - name: Cleanup PR state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gate cleanup-pr --pr "$PR_NUMBER" --repo "$REPO"
